name: X
options:
  bundleIdPrefix: com.projectx
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: "complete"
    GENERATE_INFOPLIST_FILE: "NO"

targets:
  X:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: X
        excludes:
          - "**/*.md"
    settings:
      base:
        INFOPLIST_FILE: X/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: X/Resources/X.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.projectx.toolkit
        PRODUCT_NAME: X
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        AD_HOC_CODE_SIGNING_ALLOWED: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  XTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: X
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projectx.toolkit.tests
        GENERATE_INFOPLIST_FILE: "YES"
