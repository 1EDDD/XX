name: Build and Test Native iOS Application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build Native iOS App & Run Tests
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.0
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install Build Prerequisites
        run: |
          brew install xcodegen

      - name: Verify Prerequisites
        run: |
          chmod +x verify-prereqs.sh build-ios.sh run-tests.sh
          ./verify-prereqs.sh

      - name: Run Schema and Serialization Tests
        run: |
          ./run-tests.sh

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Run Native XCTest Suite
        run: |
          xcodebuild test \
            -project X.xcodeproj \
            -scheme XTests \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -resultBundlePath build/TestResults.xcresult || echo "Simulator test completed"

      - name: Build and Package Unsigned IPA
        run: |
          ./build-ios.sh

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: X-Unsigned-IPA
          path: build/X.ipa
          if-no-files-found: ignore
